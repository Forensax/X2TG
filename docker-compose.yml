services:
  x2tg-web:
    build: .
    restart: unless-stopped
    ports:
      - "38888:8000"
    volumes:
      - ./data:/app/data
      # 可选：首次迁移旧配置时挂载 .env；迁移后可移除
      # - ./.env:/app/.env:ro
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=sqlite:///data/x2tg.db
      - TZ=Asia/Shanghai
      # 可选：首次启动自动创建管理员，之后建议删除
      # - ADMIN_INIT_PASSWORD=change-me-now
